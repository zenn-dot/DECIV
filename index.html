<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DECIV — Decision Intelligence for Commerce</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--bd:#e2e5eb;--tx:#12161d;--mu:#667085;--ac:#2f5bea;--ok:#16a34a;--wa:#d97706;--no:#dc2626}
:root[data-theme=dark]{--bg:#0c0f15;--card:#151922;--bd:#262c38;--tx:#eceff4;--mu:#8a93a5;--ac:#6b8cff;--ok:#34d399;--wa:#fbbf24;--no:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.side{position:fixed;inset:0 auto 0 0;width:220px;background:var(--card);border-right:1px solid var(--bd);padding:20px 14px;display:flex;flex-direction:column;gap:6px}
.logo{font:700 20px inherit;letter-spacing:.12em;margin:0 8px 6px}.logo small{display:block;font:400 11px inherit;letter-spacing:0;color:var(--mu)}
.nv{display:flex;gap:10px;padding:10px 12px;border-radius:10px;color:var(--mu);cursor:pointer;border:0;background:none;font:inherit;text-align:left}.nv.on{background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);font-weight:600}
main,.wrap{max-width:1180px;margin:0 auto;padding:0 24px 40px}main{margin-left:220px;max-width:none;padding-right:28px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0;gap:10px;flex-wrap:wrap}.top h1{font-size:22px;margin:0}.ctl{display:flex;gap:10px;align-items:center}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--card)}.seg button{border:0;background:none;color:var(--mu);padding:7px 11px;font:600 13px inherit;cursor:pointer}.seg button.on{background:var(--ac);color:#fff}
.ib{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:7px 11px;cursor:pointer}
.av{display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;color:var(--tx);font:inherit}.av i{width:32px;height:32px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font:700 12px inherit}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:16px;animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(4px)}}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.st small{color:var(--mu);display:block}.st b{font-size:25px}.mu{color:var(--mu)}h2,h3{margin:.2em 0 .5em}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:600 14px inherit;cursor:pointer}.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:720px}th{text-align:left;color:var(--mu);font-weight:500;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}tr.cl{cursor:pointer}tr.cl:hover{background:var(--bg)}
.bd{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}.b-ACCEPT{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}.b-NEGOTIATE{color:var(--wa);background:color-mix(in srgb,var(--wa) 16%,transparent)}.b-REJECT{color:var(--no);background:color-mix(in srgb,var(--no) 15%,transparent)}
.fg{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}label{font-size:13px;color:var(--mu);display:block}
input,select,textarea{width:100%;margin-top:4px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit}input[type=range]{padding:0;accent-color:var(--ac)}input[type=checkbox]{width:auto}textarea{min-height:90px}
.vd{border-left:6px solid}.vd.ACCEPT{border-color:var(--ok)}.vd.NEGOTIATE{border-color:var(--wa)}.vd.REJECT{border-color:var(--no)}.vd h2{font-size:30px;margin:0}
.opt{border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin:8px 0}.opt b{color:var(--ac)}.chip{border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:99px;padding:6px 14px;cursor:pointer;font:inherit}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{height:8px;background:var(--bg);border-radius:9px;margin:4px 0 12px}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:9}.ov .card{width:min(380px,90%);margin:0}.sp{width:26px;height:26px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:r 1s linear infinite;margin-bottom:12px}@keyframes r{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:10;max-width:90%}
.hero{padding:56px 0 24px}.hero h1{font-size:44px;letter-spacing:.14em;margin:0}.hero h2{font-size:34px;margin:14px 0 6px}.lt{display:flex;justify-content:space-between;align-items:center;padding:16px 0;flex-wrap:wrap;gap:10px}
.au{max-width:400px;margin:40px auto}.err{color:var(--no);font-size:13px;min-height:18px}
@media(max-width:820px){.side{inset:auto 0 0 0;width:auto;flex-direction:row;border:0;border-top:1px solid var(--bd);padding:6px 4px;justify-content:space-around;z-index:5}.logo{display:none}.nv{flex-direction:column;padding:6px 3px;font-size:10px;text-align:center;gap:0}main{margin:0;padding:0 14px 90px}.av span{display:none}.hero h1{font-size:32px}.hero h2{font-size:26px}}
</style></head><body><div id="app"></div><script type="module" src="js/app.js"></script></body></html>
